name: Verify Jev release
on:
  push:
    branches: [feat/jev-decisions]
    paths:
      - .github/workflows/jev-release-prepare.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: jev-release-prepare
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Apply reviewed source integration
        run: |
          sed -i '/checked below using actual compact source/d' scripts/wire-jev.mjs
          node scripts/wire-jev.mjs
      - run: npm ci --no-audit --no-fund
      - name: Validate Edge server types
        run: deno check --node-modules-dir=manual --no-lock supabase/functions/lixi-jev/server.ts
      - run: npm run test:unit
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - name: Commit verified source integration
        run: |
          rm -f scripts/wire-jev.mjs .github/workflows/jev-toolchain.yml .github/workflows/jev-release-prepare.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests public/sw.js package.json package-lock.json scripts/wire-jev.mjs .github/workflows
          git diff --cached --check
          git commit -m 'Release Jev photo automation with verified scanner regressions'
          git push origin HEAD:feat/jev-decisions
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jev-release-verification
          path: |
            test-results
            playwright-report
          retention-days: 3
