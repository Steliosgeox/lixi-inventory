name: Jev toolchain
on:
  push:
    branches: [feat/jev-decisions]
    paths: [.github/workflows/jev-toolchain.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm install --save-exact @typesafe-ai/sdk@0.6.0 --no-audit --no-fund
      - run: npm run prepare:capture
      - run: npx playwright install chromium webkit
      - name: Bundle local verification environment
        run: |
          tar -czf /tmp/jev-workspace.tgz --exclude=.git .
          tar -czf /tmp/jev-browsers.tgz -C "$HOME/.cache" ms-playwright
      - uses: actions/upload-artifact@v4
        with:
          name: jev-workspace
          path: /tmp/jev-workspace.tgz
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: jev-browsers
          path: /tmp/jev-browsers.tgz
          retention-days: 1
          compression-level: 0
