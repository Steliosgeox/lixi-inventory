name: CI
on:
  push:
    branches: [main, feat/capture-engine]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: capture-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Dependency security gate
        run: npm audit --audit-level=high --json > dependency-audit.json
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validate server entrypoint
        run: deno check --node-modules-dir=manual --no-lock supabase/functions/lixi-jev/index.ts
      - name: Unit tests
        run: npm run test:unit
      - name: Production build
        run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - name: Test the built application
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capture-verification
          path: |
            playwright-report
            test-results
            dependency-audit.json
          retention-days: 3
