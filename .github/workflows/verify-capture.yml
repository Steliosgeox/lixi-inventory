name: Capture Validation
on:
  push:
    branches: [feat/capture-engine]
permissions:
  contents: write
concurrency:
  group: capture-validation
  cancel-in-progress: true
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/capture-engine
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
      - name: Keep reproducible lockfile on capture branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git diff --cached --quiet || git commit -m 'Lock OpenCV capture adapter dependency'
          git push origin HEAD:feat/capture-engine
          git rev-parse HEAD > tested-commit.txt
      - run: npm run test:unit
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - name: Audit report
        if: always()
        run: npm audit --json > dependency-audit.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capture-validation
          path: |
            playwright-report
            test-results
            dependency-audit.json
            tested-commit.txt
            package-lock.json
          retention-days: 3
