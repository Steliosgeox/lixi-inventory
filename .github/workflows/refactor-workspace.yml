name: Prepare redesign workspace
on:
  push:
    branches: [feat/workspace-redesign]
    paths: [.github/workflows/refactor-workspace.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Install evaluated UI and test dependencies
        run: |
          npm install --save-exact @phosphor-icons/react @radix-ui/react-dialog @tanstack/react-table @fontsource/ibm-plex-sans --no-audit --no-fund
          npm install --save-dev --save-exact @playwright/test @axe-core/playwright --no-audit --no-fund
      - name: Package isolated development workspace
        run: tar -czf /tmp/redesign-workspace.tgz --exclude=.git --exclude='*.tgz' .
      - uses: actions/upload-artifact@v4
        with:
          name: redesign-workspace
          path: /tmp/redesign-workspace.tgz
          retention-days: 1
          compression-level: 0
