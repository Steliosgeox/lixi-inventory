name: Smart Scan feature checks
on:
  push:
    branches: [feat/smart-scan-expiry]
permissions:
  contents: read
concurrency:
  group: smart-scan-feature
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm audit --audit-level=high
      - run: npm run test:unit
      - run: npm run build
