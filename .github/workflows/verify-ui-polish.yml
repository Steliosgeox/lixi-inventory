name: Verify UI polish
on:
  push:
    branches: [feat/workspace-redesign]
    paths: [.github/workflows/verify-ui-polish.yml]
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply narrowly scoped browser-test corrections
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          p=Path('src/ui/Workspace.tsx')
          s=p.read_text()
          changes=[
            ('money, signed, normalize, matches, labels, exportProducts, dateLabel, type Filter', 'money, signed, normalize, searchProducts, matches, labels, exportProducts, dateLabel, type Filter'),
            ('<button className="wk-command" onClick=', '<button className="wk-command" aria-label="Αναζήτηση προϊόντος" onClick='),
            ("products.filter(p => matches(p, filter) && (locationFilter === 'all' || p.location_code === locationFilter) && normalize(`${p.internal_code} ${p.description} ${p.barcode ?? ''}`).includes(normalize(query.trim())))", "searchProducts(products.filter(p => matches(p, filter) && (locationFilter === 'all' || p.location_code === locationFilter)), query)"),
            ("products.filter(p => normalize(`${p.internal_code} ${p.description} ${p.barcode ?? ''}`).includes(normalize(q.trim()))).slice(0,9)", "searchProducts(products, q).slice(0,9)"),
            ('data: filtered, columns, state:', 'data: filtered, columns, defaultColumn: { sortDescFirst: false }, state:'),
            ('<div className="wk-activity-row"', '<div className="wk-activity-row"'),
          ]
          for before,after in changes:
            if before==after: continue
            assert s.count(before)==1, ('Unexpected source for patch',before)
            s=s.replace(before,after,1)
          p.write_text(s)
          p=Path('src/ui/data.ts')
          s=p.read_text()
          assert 'export function searchProducts' not in s
          s += '''\n// Exact identifiers take precedence over fragments inside another barcode.\nexport function searchProducts(rows: ProductOverview[], query: string) {\n  const q = normalize(query.trim())\n  if (!q) return rows\n  const exact = rows.filter(p => normalize(p.internal_code) === q || normalize(p.barcode ?? '') === q)\n  return exact.length ? exact : rows.filter(p => normalize(`${p.internal_code} ${p.description} ${p.barcode ?? ''}`).includes(q))\n}\n'''
          p.write_text(s)
          p=Path('src/ui/workspace.css')
          s=p.read_text()
          assert '--muted:#67766e' in s
          s=s.replace('--muted:#67766e','--muted:#56665c')
          s=re.sub(r'font-size:(8|9|10|11|12)px',lambda m: 'font-size:'+str(int(m.group(1))+1)+'px',s)
          p.write_text(s)
          PY
      - name: Commit corrected application files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ui/Workspace.tsx src/ui/data.ts src/ui/workspace.css
          git commit -m 'Improve text contrast and readability; prioritize exact identifiers; label mobile search'
          git push origin HEAD:feat/workspace-redesign
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-polish-verification
          path: |
            test-results
            playwright-report
          retention-days: 3
