name: Add official GS1 parser
on:
  push:
    branches: [feat/smart-scan-expiry]
    paths:
      - .github/workflows/add-gs1-parser.yml
permissions:
  contents: write
jobs:
  pin:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --save-exact gs1encoder@1.4.1 --no-audit --no-fund
      - run: npm run test:unit
      - run: npm run build
      - name: Commit locked dependency
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/add-gs1-parser.yml
          git add package.json package-lock.json .github/workflows
          git commit -m 'Add official GS1 Syntax Engine 1.4.1'
          git push origin HEAD:feat/smart-scan-expiry
