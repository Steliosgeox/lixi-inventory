name: Finish Jev release
on:
  push:
    branches: [feat/jev-decisions]
    paths: [.github/workflows/finish-jev-release.yml]
permissions:
  contents: write
concurrency:
  group: finish-jev-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Apply checksum-verified release changes
        run: |
          sed -i '/checked below using actual compact source/d' scripts/wire-jev.mjs
          node scripts/wire-jev.mjs
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('supabase/functions/lixi-jev/core.ts')
          text=p.read_text()
          old='ocr:v.ocr,barcodes:v.barcodes}'
          assert old in text
          text=text.replace(old,'ocr:{engine:v.ocr.engine,width:v.ocr.width,height:v.ocr.height,elapsedMs:finite(v.ocr.elapsedMs)&&v.ocr.elapsedMs>=0?v.ocr.elapsedMs:0,lines:v.ocr.lines as Line[]},barcodes:v.barcodes.map((b:any)=>({text:b.text,format:b.format,...(b.symbologyIdentifier?{symbologyIdentifier:b.symbologyIdentifier}:{})}))}')
          p.write_text(text)
          for item in json.loads(Path('scripts/release-edits.json').read_text()):
              p=Path(item['path']);text=p.read_text()
              assert hashlib.sha256(text.encode()).hexdigest()==item['base'], 'Base drift: '+str(p)
              for start,end,fragment in reversed(item['edits']):
                  text=text[:start]+fragment+text[end:]
              assert hashlib.sha256(text.encode()).hexdigest()==item['result'], 'Result mismatch: '+str(p)
              p.write_text(text)
          p=Path('src/jev/photos.ts');text=p.read_text()
          fixes=[
              ("import Dexie,{type Table} from 'dexie'", "import Dexie,{type Table} from 'dexie'\nimport { encodePhoto,restorePhoto,type StoredPhoto } from './photoStorage'"),
              ('export type PhotoJob={','export type PhotoJob=StoredPhoto&{'),
              ('blob:Blob|null;input:','input:'),
              ("state:'queued',blob,input:null","state:'queued',...await encodePhoto(blob),input:null"),
              ('if(!job.blob)throw','const source=restorePhoto(job);if(!source)throw'),
              ('prepareImage(job.blob)','prepareImage(source)'),
              ("{blob:image.blob,input,state:'sending'","{...await encodePhoto(image.blob),input,state:'sending'"),
              ('if(!current?.blob)throw','const evidence=current?restorePhoto(current):null;if(!evidence)throw'),
              ('upload(input.evidencePath,current.blob,','upload(input.evidencePath,evidence,'),
              ('result:data,blob:null,message:','result:data,blob:null,bytes:null,message:')
          ]
          for old,new in fixes:
              assert text.count(old)==1, 'Storage patch drift: '+old
              text=text.replace(old,new)
          p.write_text(text)
          Path('supabase/functions/lixi-jev/index.ts').write_text("import { handleRequest } from './server.ts'\nDeno.serve(handleRequest)\n")
          for name in ['scripts/wire-jev.mjs','.github/workflows/jev-toolchain.yml','.github/workflows/jev-release-prepare.yml','.github/workflows/release-source.yml','.github/workflows/smartscan-check.yml']:
              Path(name).unlink(missing_ok=True)
          PY
      - run: npm ci --no-audit --no-fund
      - name: Validate Edge Function
        run: deno check --node-modules-dir=manual --no-lock supabase/functions/lixi-jev/index.ts
      - name: Unit tests
        run: npm run test:unit
      - name: Production build
        run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - name: Desktop and iPhone WebKit regressions
        run: npm run test:e2e
      - name: Commit verified release source
        run: |
          rm -f scripts/release-edits.json scripts/release-delta-*.b64 .github/workflows/finish-jev-release.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Release Jev photo automation, expiry monitoring and iPhone fixes'
          git push origin HEAD:feat/jev-decisions
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jev-final-verification
          path: |
            test-results
            playwright-report
          retention-days: 3
