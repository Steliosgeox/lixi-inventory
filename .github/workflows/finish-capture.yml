name: Verify Capture Release
on:
  push:
    branches: [feat/capture-engine]
    paths: [.github/workflows/finish-capture.yml, scripts/capture-ready-*.b64]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: capture-release
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/capture-engine
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore checksum-verified source
        run: |
          python - <<'PY'
          import pathlib,base64,hashlib,lzma,json
          payload=base64.b64decode(''.join(pathlib.Path(f'scripts/capture-ready-{i}.b64').read_text().strip() for i in range(4)),validate=True)
          assert hashlib.sha256(payload).hexdigest()=='eb708a0f4ecf2bb4722895ab025e64a7d6903378f21798020d67003081a4ed94'
          files=json.loads(lzma.decompress(payload))['files']
          for name,content in files.items():
              path=pathlib.PurePosixPath(name)
              assert not path.is_absolute() and '..' not in path.parts and '.github' not in path.parts
              target=pathlib.Path(name);target.parent.mkdir(parents=True,exist_ok=True);target.write_text(content)
          print('Restored',len(files),'application and test files')
          PY
      - name: Resolve exact dependencies and preserve lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund
      - name: Commit application source without touching workflow permissions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src public/sw.js package.json package-lock.json vite.config.ts vitest.config.ts playwright.config.ts tests docs scripts/prepare-capture-assets.mjs supabase .gitignore
          git diff --cached --quiet || git commit -m 'Integrate Capture 0.4: Greek OCR workers, WASM barcode, HID keyboard input, reviewed offline receipts'
          git push origin HEAD:feat/capture-engine
          git rev-parse HEAD > tested-commit.txt
      - run: npm run test:unit
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - name: Dependency audit report
        if: always()
        run: npm audit --json > dependency-audit.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capture-release-verification
          path: |
            playwright-report
            test-results
            dependency-audit.json
            tested-commit.txt
            package-lock.json
          retention-days: 3
