name: Prepare Capture Engine
on:
  push:
    branches: [feat/capture-engine]
    paths: [.github/workflows/prepare-capture.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Install real upstream capture libraries
        run: |
          npm install --save-exact zxing-wasm @paddleocr/paddleocr-js dexie onscan.js --no-audit --no-fund
          npm install --save-dev --save-exact vitest fake-indexeddb sharp --no-audit --no-fund
          npm audit --json > dependency-audit.json || true
      - name: Package source and toolchain without secrets
        run: tar -czf /tmp/capture-workspace.tgz --exclude=.git --exclude='*.tgz' .
      - uses: actions/upload-artifact@v4
        with:
          name: capture-workspace
          path: /tmp/capture-workspace.tgz
          retention-days: 2
          compression-level: 0
