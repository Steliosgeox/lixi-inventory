name: Verify patched capture toolchain
on:
  push:
    branches: [feat/capture-engine]
    paths: [.github/workflows/verify-build-toolchain.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  patch-and-verify:
    if: github.ref == 'refs/heads/feat/capture-engine'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/capture-engine
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Pin the patched Vite 7 build tool
        run: npm install --save-dev --save-exact vite@7.3.6 --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
      - name: Block unresolved high or critical advisory findings
        run: npm audit --audit-level=high --json > dependency-audit.json
      - run: npm run test:unit
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - name: Commit only the verified dependency manifests
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git diff --cached --quiet || git commit -m 'Pin Vite 7.3.6 after capture tests and dependency audit pass'
          git push origin HEAD:feat/capture-engine
          git rev-parse HEAD > tested-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: patched-capture-verification
          path: |
            playwright-report
            test-results
            dependency-audit.json
            tested-commit.txt
            package.json
            package-lock.json
          retention-days: 3
