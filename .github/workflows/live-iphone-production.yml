name: Live iPhone production check
on:
  push:
    branches: [ops/iphone-live-check-20260922]
permissions:
  contents: read
jobs:
  iphone-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps webkit
      - name: Check live production in iPhone 13 WebKit emulation
        run: |
          cat > /tmp/live-iphone.mjs <<'NODE'
          import { webkit, devices } from '@playwright/test'
          import fs from 'node:fs'
          const store='00000000-0000-4000-8000-000000000001'
          const userId='00000000-0000-4000-8000-000000000002'
          const names=['Μουστάρδα απαλή 250 g','Κέτσαπ κλασική 500 g','Πέννες ολικής 500 g','Ρύζι Καρολίνα 500 g','Φακές ψιλές 500 g','Ζωμός λαχανικών 120 g']
          const products=Array.from({length:48},(_,i)=>({product_id:`00000000-0000-4000-9000-${String(i+1).padStart(12,'0')}`,store_id:store,internal_code:String(i+1).padStart(7,'0'),barcode:i%3?null:`520000000${String(i).padStart(4,'0')}`,description:`${names[i%6]} / live check ${i+1}`,unit:i%8===0?'Κιλό':'Τεμάχιο',catalog_price:1.4+(i%6),shelf_price:i<36?1.4+(i%6)+(i<6?.25:0):null,price_diff:i<6?.25:i<36?0:null,price_status:i<6?'different':i<36?'same':'unchecked',source_ref:i<36?`test-photo-${i+1}.jpg`:null,observed_at:i<36?'2026-09-18T12:00:00Z':null,location_code:i<8?'A':null,row_label:i<8?'1,00':null,number_label:i<8?`${i+1},10`:null}))
          const locations=[{id:'00000000-0000-4000-8000-000000000003',code:'A',name:'Θέση Α',sort_order:1},{id:'00000000-0000-4000-8000-000000000004',code:'Δ',name:'Θέση Δ',sort_order:2}]
          const user={id:userId,aud:'authenticated',role:'authenticated',email:'tester@example.invalid',app_metadata:{provider:'email'},user_metadata:{},created_at:'2026-09-01T00:00:00Z'}
          const browser=await webkit.launch()
          const context=await browser.newContext({...devices['iPhone 13'],serviceWorkers:'block'})
          const page=await context.newPage()
          await page.addInitScript(({user,exp})=>{
            const token=`${btoa(JSON.stringify({alg:'HS256',typ:'JWT'}))}.${btoa(JSON.stringify({sub:user.id,exp,role:'authenticated',aud:'authenticated'}))}.test-signature`
            localStorage.setItem('sb-zgdfgznwxioxmlrvssaa-auth-token',JSON.stringify({access_token:token,refresh_token:'test-refresh-token',expires_in:86400,expires_at:exp,token_type:'bearer',user}))
            Object.defineProperty(navigator,'standalone',{configurable:true,value:true})
          },{user,exp:Math.floor(Date.now()/1000)+86400})
          await page.route('https://zgdfgznwxioxmlrvssaa.supabase.co/**',async route=>{
            const path=new URL(route.request().url()).pathname
            const headers={'access-control-allow-origin':'*','content-type':'application/json'}
            let body=[]
            if(path.includes('/auth/v1/user')) body=user
            else if(path.endsWith('/memberships')) body={store_id:store,user_id:userId,role:'owner'}
            else if(path.endsWith('/product_overview')) body=products
            else if(path.endsWith('/locations')) body=locations
            else if(path.endsWith('/price_observations')) body=[{id:'hist-test',observed_price:1.65,observed_at:'2026-09-18T12:00:00Z',source_ref:'test-source.jpg',verified:true}]
            await route.fulfill({status:200,headers,body:JSON.stringify(body)})
          })
          await page.goto('https://lixi-inventory.vercel.app/',{waitUntil:'networkidle'})
          await page.addStyleTag({content:':root{--safe-top:59px;--safe-bottom:34px;--safe-left:0px;--safe-right:0px}'})
          await page.getByRole('heading',{name:'Έλεγχος καταλόγου'}).waitFor()
          const buttons=await page.locator('.wk-top button').all()
          for(const button of buttons){const b=await button.boundingBox();if(!b||b.y<59||b.width<44||b.height<44)throw new Error('Top control violates iPhone safe-area/touch target')}
          if(await page.evaluate(()=>document.documentElement.scrollWidth>innerWidth+1))throw new Error('Dashboard horizontal overflow')
          await page.screenshot({path:'iphone-live-dashboard.png',fullPage:false})
          await page.locator('.wk-mobile-nav').getByRole('button',{name:'Κατάλογος',exact:true}).click()
          if(await page.evaluate(()=>document.documentElement.scrollWidth>innerWidth+1))throw new Error('Catalogue horizontal overflow')
          const first=page.locator('.wk-table tbody tr').first()
          await first.locator('[data-column=catalog_price]').waitFor()
          await first.locator('[data-column=shelf_price]').waitFor()
          await page.screenshot({path:'iphone-live-catalogue.png',fullPage:false})
          await page.getByRole('button',{name:'Αρχική',exact:true}).click()
          await page.locator('.wk-exception').first().click()
          const save=page.getByRole('button',{name:'Αποθήκευση αλλαγών',exact:true})
          await save.waitFor()
          const sb=await save.boundingBox()
          if(!sb)throw new Error('Save button missing')
          await page.screenshot({path:'iphone-live-drawer.png',fullPage:false})
          fs.writeFileSync('iphone-live-results.json',JSON.stringify({url:page.url(),viewport:page.viewportSize(),topSafeArea:true,catalogueNoOverflow:true,saveVisible:true},null,2))
          await browser.close()
          NODE
          node /tmp/live-iphone.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: iphone-live-production
          path: |
            iphone-live-dashboard.png
            iphone-live-catalogue.png
            iphone-live-drawer.png
            iphone-live-results.json
          retention-days: 3
