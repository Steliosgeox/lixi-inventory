name: Fast publish iPhone source
on:
  push:
    branches: [fix/iphone-workspace]
    paths:
      - .github/workflows/iphone-fast-push.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply reviewed iPhone source patch
        run: python scripts/apply-iphone-refinement.py
      - run: npm ci --no-audit --no-fund
      - run: npm run test:unit
      - run: npm run build
      - name: Commit compiled source
        run: |
          rm -f scripts/apply-iphone-refinement.py .github/workflows/iphone-finish.yml .github/workflows/iphone-prep.yml .github/workflows/iphone-fast-push.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests index.html public/sw.js scripts .github/workflows
          git commit -m 'Release iPhone safe-area and mobile workspace refinements'
          git push origin HEAD:fix/iphone-workspace
