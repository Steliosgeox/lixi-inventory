name: Verify workspace release
on:
  push:
    branches: [feat/workspace-redesign]
    paths: ['.release/workspace.03.b64']
permissions:
  contents: write
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: redesign-workspace
          run-id: 35450019680
          github-token: ${{ github.token }}
          path: /tmp/leaksy-toolchain
      - name: Restore exact evaluated dependency lock
        run: tar -xzf /tmp/leaksy-toolchain/redesign-workspace.tgz -C /tmp/leaksy-toolchain ./package-lock.json
      - name: Verify and unpack inspected source files
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { brotliDecompressSync } from 'node:zlib';
          import { createHash } from 'node:crypto';
          import path from 'node:path';
          const encoded = [0,1,2,3].map(i => fs.readFileSync(`.release/workspace.${String(i).padStart(2,'0')}.b64`,'utf8').trim()).join('');
          const raw = brotliDecompressSync(Buffer.from(encoded,'base64'), { maxOutputLength: 1048576 });
          if (createHash('sha256').update(raw).digest('hex') !== '3e646735794225602265a023bec6045f981e3547e71753202cc7be80c67c1077') throw Error('Source checksum mismatch');
          const allowed = ['src/App.tsx','src/main.tsx','src/ui/Workspace.tsx','src/ui/workspace.css','src/ui/data.ts','public/sw.js','package.json','vite.config.ts','playwright.config.ts','tests/workspace.spec.ts','.github/workflows/ci.yml','docs/RELEASE-GATES.md','docs/FRONTEND-RELEASE.md'];
          const source = JSON.parse(raw.toString('utf8'));
          if (Object.keys(source).sort().join('|') !== allowed.sort().join('|')) throw Error('Unexpected source paths');
          for (const [file, content] of Object.entries(source)) { if (typeof content !== 'string') throw Error('Invalid source'); fs.mkdirSync(path.dirname(file), { recursive: true }); fs.writeFileSync(file,content); }
          const lock = JSON.parse(fs.readFileSync('/tmp/leaksy-toolchain/package-lock.json','utf8'));
          lock.version='0.3.0'; lock.packages[''].version='0.3.0';
          fs.writeFileSync('package-lock.json',JSON.stringify(lock,null,2)+'\n');
          NODE
      - name: Commit complete source to isolated redesign branch
        run: |
          rm -rf .release
          rm -f .github/workflows/assemble-workspace-release.yml .github/workflows/refactor-workspace.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Refactor Leaksy workspace with catalogue tools, accessible detail drawer and safe caching'
          git push origin HEAD:feat/workspace-redesign
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-release-verification
          path: |
            test-results
            playwright-report
          retention-days: 3
